# The gates `make ci` runs locally that need no backend checkout: the code builds with warnings as
# errors, it is formatted, the suite passes, and the package that would be published builds. The
# generated-code drift check and the shared conformance suite need the backend's tools/sdkgen and run
# locally (`make ci` with OBLODAI_BACKEND); live tests need a running gateway.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Oblodai.sln

      - name: Build (warnings are errors)
        run: dotnet build Oblodai.sln --no-restore -c Release -warnaserror

      - name: Format
        run: dotnet format Oblodai.sln --verify-no-changes --no-restore --exclude src/Oblodai/Generated

      # The live tier skips itself without OBLODAI_LIVE_URL, conformance without the backend checkout.
      - name: Test
        run: dotnet test tests/Oblodai.Tests --no-build -c Release --logger "console;verbosity=normal"

      - name: Pack
        run: dotnet pack src/Oblodai/Oblodai.csproj --no-build -c Release -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.*nupkg
          if-no-files-found: error
