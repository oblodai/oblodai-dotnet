# NuGet publishes by tag: pushing vX.Y.Z re-runs every gate CI runs, checks that the tag and the
# version in Oblodai.csproj agree, and only then pushes the package (and its symbols) to nuget.org.
# A missing NUGET_API_KEY fails the job loudly rather than uploading nothing and reporting success.
name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  CI: "true"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Version matches the tag
        run: |
          declared="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Oblodai/Oblodai.csproj | head -n 1)"
          if [ "v${declared}" != "${GITHUB_REF_NAME}" ]; then
            echo "Oblodai.csproj declares Version ${declared}, but the tag is ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Restore
        run: dotnet restore Oblodai.sln

      - name: Build (warnings are errors)
        run: dotnet build Oblodai.sln --no-restore -c Release -warnaserror

      - name: Test
        run: dotnet test tests/Oblodai.Tests --no-build -c Release --logger "console;verbosity=normal"
        env:
          SDKGEN_CONFORMANCE: ${{ github.workspace }}/contract/tools/sdkgen/conformance

      - name: Pack
        run: dotnet pack src/Oblodai/Oblodai.csproj --no-build -c Release -o artifacts

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "${NUGET_API_KEY}" ]; then
            echo 'NUGET_API_KEY is not set: the package was built but cannot be published' >&2
            exit 1
          fi
          dotnet nuget push "artifacts/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${NUGET_API_KEY}" \
            --skip-duplicate

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nupkg
          path: artifacts/*.*nupkg
          if-no-files-found: error
